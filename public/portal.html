<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Orion Client — Portal do Cliente</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1623; --bg2:#151d2e; --bg3:#1a2540;
  --sf:#1e2d48; --sf2:#243358; --sf3:#2a3d68;
  --bd:rgba(100,140,220,.15); --bd2:rgba(100,140,220,.22);
  --tx:#e4ecf7; --tx2:#9bb5d8; --tx3:#5a7ba8;
  --cy:#22d3ee; --cy2:#06b6d4; --cy3:rgba(34,211,238,.08);
  --pu:#a78bfa; --pu2:#8b5cf6; --pu3:rgba(167,139,250,.08);
  --am:#f59e0b; --am2:#d97706;
  --gn:#10b981; --gnbg:rgba(16,185,129,.12); --gnbd:rgba(16,185,129,.3);
  --rd:#f87171; --rdbg:rgba(248,113,113,.12); --rdbd:rgba(248,113,113,.3);
  --or:#fb923c; --orbg:rgba(251,146,60,.12); --orbd:rgba(251,146,60,.3);
  --bl:#60a5fa; --blbg:rgba(96,165,250,.12); --blbd:rgba(96,165,250,.3);
  --r:10px; --rlg:14px;
  --sh:0 4px 24px rgba(0,0,0,.4); --shlg:0 8px 40px rgba(0,0,0,.5);
  --glow-cy:0 0 20px rgba(34,211,238,.15); --glow-pu:0 0 20px rgba(167,139,250,.15);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);font-size:14px;min-height:100vh;background-image:radial-gradient(ellipse at 20% 0%,rgba(34,211,238,.04) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(167,139,250,.04) 0%,transparent 50%)}
input,select,textarea,button{font-family:'DM Sans',sans-serif;font-size:13px;box-sizing:border-box}
input:not([type=range]),select,textarea{padding:9px 12px;border:1px solid var(--bd2);border-radius:var(--r);color:var(--tx);background:var(--sf);transition:border .15s,box-shadow .15s;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 3px rgba(34,211,238,.1)}
select option{background:var(--bg3);color:var(--tx)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--sf3);border-radius:3px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 16px;height:36px;border-radius:8px;border:none;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--cy2),var(--cy));color:#0f1623}.btn-primary:hover{opacity:.9;box-shadow:var(--glow-cy)}
.btn-accent{background:linear-gradient(135deg,var(--pu2),var(--pu));color:#fff}.btn-accent:hover{opacity:.9;box-shadow:var(--glow-pu)}
.btn-amber{background:linear-gradient(135deg,var(--am2),var(--am));color:#0f1623}.btn-amber:hover{opacity:.9}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--tx2);border:1px solid var(--bd2)}.btn-ghost:hover{background:rgba(255,255,255,.1);color:var(--tx)}
.btn-danger{background:var(--rdbg);color:var(--rd);border:1px solid var(--rdbd)}
.btn-sm{height:30px;padding:0 12px;font-size:11px}
.btn-lg{height:44px;padding:0 24px;font-size:14px;font-weight:700}
.card{background:var(--sf);border-radius:var(--rlg);border:1px solid var(--bd);padding:20px}
.label{display:block;font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px}
.fg{margin-bottom:14px}

/* LOGIN */
#portal-login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;background-image:radial-gradient(ellipse at 30% 20%,rgba(34,211,238,.08) 0%,transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(167,139,250,.08) 0%,transparent 50%)}
.pbox{background:var(--sf);border-radius:20px;padding:40px 36px;width:380px;box-shadow:var(--shlg);border:1px solid var(--bd2)}
.plogo{text-align:center;margin-bottom:28px}
.plogo-icon{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;overflow:hidden;background:var(--bg3);border:1px solid var(--bd2)}
.plogo-title{font-size:20px;font-weight:700;color:var(--tx)}
.plogo-sub{font-size:11px;color:var(--tx3);margin-top:3px}
.perr{background:var(--rdbg);color:var(--rd);border:1px solid var(--rdbd);border-radius:var(--r);padding:9px 13px;font-size:12px;margin-bottom:12px;display:none}
.plbtn{width:100%;height:44px;background:linear-gradient(135deg,var(--cy2),var(--cy));color:#0f1623;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:8px;transition:all .2s}
.plbtn:hover{opacity:.9;box-shadow:var(--glow-cy)}

/* LAYOUT */
#portal-app{display:none;min-height:100vh;flex-direction:column}
.portal-header{
  background:linear-gradient(90deg,var(--bg2),var(--bg3));
  padding:0 28px;height:58px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
  border-bottom:1px solid var(--bd);
  backdrop-filter:blur(12px);
  box-shadow:0 4px 20px rgba(0,0,0,.3)
}
.portal-logo{display:flex;align-items:center;gap:10px}
.portal-logo-badge{font-size:9px;color:var(--cy);background:var(--cy3);border:1px solid rgba(34,211,238,.2);border-radius:4px;padding:2px 7px;margin-left:4px;font-weight:600;letter-spacing:.8px;text-transform:uppercase}
.portal-logo-name{color:var(--tx);font-size:14px;font-weight:700}
.portal-user{display:flex;align-items:center;gap:8px;color:var(--tx2);font-size:12px}
.portal-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--cy2),var(--pu2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.portal-content{flex:1;padding:24px 28px;max-width:1100px;margin:0 auto;width:100%}
.portal-nav{display:flex;gap:2px;margin-bottom:22px;border-bottom:1px solid var(--bd);padding-bottom:0}
.pnav-btn{padding:10px 18px;border:none;background:none;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;color:var(--tx3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;margin-bottom:-1px}
.pnav-btn:hover{color:var(--tx);background:rgba(255,255,255,.04)}
.pnav-btn.active{color:var(--cy);border-bottom-color:var(--cy)}
.ppage{display:none}.ppage.active{display:block}

/* OS Cards */
.os-cards{display:flex;flex-direction:column;gap:10px}
.os-card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rlg);padding:16px 18px 16px 22px;position:relative;overflow:hidden;transition:all .2s;cursor:default}
.os-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--bd)}
.os-card:hover{border-color:var(--bd2);box-shadow:var(--sh)}
.os-card.aberta::before{background:linear-gradient(to bottom,var(--bl),rgba(96,165,250,.4))}
.os-card.andamento::before{background:linear-gradient(to bottom,var(--am),rgba(245,158,11,.4))}
.os-card.concluida::before{background:linear-gradient(to bottom,var(--gn),rgba(16,185,129,.4))}
.os-card.cancelada::before{background:linear-gradient(to bottom,var(--rd),rgba(248,113,113,.4))}
.os-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.os-card-num{font-size:13px;font-weight:700;color:var(--cy);font-family:'JetBrains Mono',monospace}
.os-card-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:10px}
.os-info-item{display:flex;flex-direction:column;gap:2px}
.os-info-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3)}
.os-info-val{font-size:12px;color:var(--tx);font-weight:500}
.os-card-foot{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--bd)}
.status-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;border:1px solid transparent}
.sp-aberta{background:var(--blbg);color:var(--bl);border-color:var(--blbd)}
.sp-andamento{background:var(--orbg);color:var(--or);border-color:var(--orbd)}
.sp-concluida{background:var(--gnbg);color:var(--gn);border-color:var(--gnbd)}
.sp-cancelada{background:var(--rdbg);color:var(--rd);border-color:var(--rdbd)}
.sp-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;background:currentColor}

/* Chamado Form */
.chamado-form{max-width:640px}
.fsec{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--cy);padding-bottom:6px;border-bottom:1px solid var(--bd);margin-bottom:12px;margin-top:18px;display:flex;align-items:center;gap:6px}
.fsec::before{content:'';width:10px;height:1px;background:var(--cy)}
.fsec:first-child{margin-top:0}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid2 .full{grid-column:1/-1}
.ok-msg{background:var(--gnbg);border:1px solid var(--gnbd);color:var(--gn);border-radius:var(--r);padding:12px 16px;font-size:13px;font-weight:600;display:none;margin-bottom:14px}

/* Empty */
.empty-state{text-align:center;padding:48px 20px;color:var(--tx3)}
.empty-ico{font-size:40px;margin-bottom:12px;opacity:.4}
.empty-title{font-size:14px;font-weight:700;color:var(--tx2);margin-bottom:6px}
.empty-sub{font-size:12px}

/* Modal */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:500;display:none;backdrop-filter:blur(4px)}
.mov.open{display:flex}
.modal{background:var(--bg2);border-radius:var(--rlg);width:100%;max-width:680px;max-height:92vh;overflow-y:auto;box-shadow:var(--shlg);border:1px solid var(--bd2)}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--bd)}
.mhd-title{font-size:14px;font-weight:700;color:var(--tx)}
.mbody{padding:20px 22px}
.mfoot{padding:14px 22px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px}
.btnx{width:30px;height:30px;background:var(--sf);border:1px solid var(--bd);border-radius:7px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--tx3);transition:all .15s}
.btnx:hover{background:var(--rdbg);color:var(--rd);border-color:var(--rdbd)}

/* OS Print */
.os-print-wrap{font-size:12px;line-height:1.7;color:var(--tx)}
.os-print-header{background:linear-gradient(135deg,var(--bg3),var(--sf2));color:var(--tx);border-radius:10px;padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--bd2)}
.os-print-empresa{font-size:15px;font-weight:700}
.os-print-num{font-size:22px;font-weight:700;color:var(--cy);font-family:'JetBrains Mono',monospace}
.os-print-section{margin-bottom:14px}
.os-print-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--cy);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--bd)}
.os-print-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.os-print-item{background:var(--sf);border-radius:7px;padding:8px 11px;border:1px solid var(--bd)}
.os-print-item-label{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--tx3);margin-bottom:2px}
.os-print-item-val{font-size:12px;font-weight:600;color:var(--tx)}
.os-print-text{background:var(--sf);border-radius:7px;padding:10px 13px;font-size:12px;color:var(--tx);min-height:36px;line-height:1.7;border:1px solid var(--bd)}
@media print{
  #portal-login,#portal-app .portal-header,#portal-app .portal-nav,.mfoot,.btnx{display:none!important}
  body{background:#fff;color:#000}
  .mov.open{position:static;background:none;display:block}
  .modal{box-shadow:none;max-height:none;background:#fff;border:none}
}

/* KPI strip */
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.kpi-card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rlg);padding:14px 16px;text-align:center;position:relative;overflow:hidden;transition:transform .2s}
.kpi-card:hover{transform:translateY(-2px)}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--cy),var(--pu))}
.kpi-val{font-size:24px;font-weight:700;color:var(--cy);font-family:'DM Sans',sans-serif}
.kpi-lbl{font-size:9px;color:var(--tx3);font-weight:600;text-transform:uppercase;letter-spacing:.7px;margin-top:3px}
</style>
</head>

<script>
const PG = { ordens:[], equips:[], clienteId:'' };

async function api(method, url, body) {
  const opts = { method, headers:{'Content-Type':'application/json'}, credentials:'include' };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(url, opts);
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || 'Erro na requisição');
  return data;
}

// ── LOGIN ──
async function doPortalLogin() {
  const login = document.getElementById('p-login').value.trim();
  const senha = document.getElementById('p-senha').value;
  const err = document.getElementById('p-err');
  const btn = document.getElementById('p-btn-login');
  err.style.display = 'none';
  if (!login || !senha) { err.textContent='Preencha usuário e senha.'; err.style.display='block'; return; }
  btn.textContent = 'Entrando...'; btn.disabled = true;
  try {
    const res = await api('POST','/api/portal/login',{login,senha});
    document.getElementById('portal-login').style.display = 'none';
    document.getElementById('portal-app').style.display = 'flex';
    document.getElementById('portal-app').style.flexDirection = 'column';
    document.getElementById('p-av').textContent = res.nome[0].toUpperCase();
    document.getElementById('p-nome-hd').textContent = res.nome;
    await carregarPortal();
  } catch(e) {
    err.textContent = e.message; err.style.display = 'block';
  } finally { btn.textContent = 'Entrar no Orion Client'; btn.disabled = false; }
}

async function doPortalLogout() {
  await api('POST','/api/portal/logout');
  document.getElementById('portal-login').style.display = 'flex';
  document.getElementById('portal-app').style.display = 'none';
  document.getElementById('p-login').value='';
  document.getElementById('p-senha').value='';
}

// ── NAVEGAÇÃO ──
function pNav(pg, el) {
  document.querySelectorAll('.ppage').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.pnav-btn').forEach(x=>x.classList.remove('active'));
  document.getElementById('pp-'+pg).classList.add('active');
  el.classList.add('active');
  if (pg === 'abrir') { document.getElementById('p-ok-msg').style.display='none'; }
}

// ── CARREGAR DADOS ──
async function carregarPortal() {
  try {
    const [ordens, equips] = await Promise.all([
      api('GET','/api/portal/ordens'),
      api('GET','/api/portal/equipamentos')
    ]);
    PG.ordens = ordens;
    PG.equips = equips;
    renderPortalOS();
    renderKpis();
    popularEquips();
  } catch(e) { console.error(e); }
}

function renderKpis() {
  const o = PG.ordens;
  const kpis = [
    { lbl:'Total', val: o.length, cor:'var(--bl2)' },
    { lbl:'Em Aberto', val: o.filter(x=>['Aberta','Em andamento'].includes(x.status)).length, cor:'var(--or)' },
    { lbl:'Concluídos', val: o.filter(x=>x.status==='Concluída').length, cor:'var(--gn)' },
    { lbl:'Equipamentos', val: PG.equips.length, cor:'var(--pu,#6b3fa0)' },
  ];
  document.getElementById('p-kpis').innerHTML = kpis.map(k=>
    `<div class="kpi-card"><div class="kpi-val" style="color:${k.cor}">${k.val}</div><div class="kpi-lbl">${k.lbl}</div></div>`
  ).join('');
}

function renderPortalOS() {
  const filtro = document.getElementById('p-f-status').value;
  let lista = filtro ? PG.ordens.filter(o=>o.status===filtro) : PG.ordens;
  const el = document.getElementById('p-os-list');
  if (lista.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="empty-ico">📋</div><div class="empty-title">Nenhum chamado encontrado</div><div class="empty-sub">Clique em "Abrir Chamado" para registrar uma ocorrência.</div></div>`;
    return;
  }
  el.innerHTML = lista.map(o => {
    const stKey = o.status.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ /g,'-');
    const stClass = {'aberta':'aberta','em-andamento':'andamento','concluida':'concluida','cancelada':'cancelada'}[stKey]||'aberta';
    const spClass = {'Aberta':'sp-aberta','Em andamento':'sp-andamento','Concluída':'sp-concluida','Cancelada':'sp-cancelada'}[o.status]||'sp-aberta';
    const dot = {'Aberta':'#3b82f6','Em andamento':'#c06010','Concluída':'#1a7a4a','Cancelada':'#b83030'}[o.status]||'#94a3b8';
    return `
    <div class="os-card ${stClass}">
      <div class="os-card-header">
        <div class="os-card-num">OS #${o.num} ${o.tipo?'· '+o.tipo:''}</div>
        <span class="status-pill ${spClass}"><span class="sp-dot" style="background:${dot}"></span>${o.status}</span>
      </div>
      <div class="os-card-body">
        <div class="os-info-item"><span class="os-info-label">Data Abertura</span><span class="os-info-val">${fmtData(o.data_ab)}</span></div>
        <div class="os-info-item"><span class="os-info-label">Equipamento</span><span class="os-info-val">${o.modelo||'—'}</span></div>
        <div class="os-info-item"><span class="os-info-label">Nº Série</span><span class="os-info-val">${o.nserie||'—'}</span></div>
        <div class="os-info-item"><span class="os-info-label">Técnico</span><span class="os-info-val">${o.tecnico_nome||'Em definição'}</span></div>
        ${o.sla_deadline?`<div class="os-info-item"><span class="os-info-label">Prazo SLA</span><span class="os-info-val">${fmtDataHora(o.sla_deadline)}</span></div>`:''}
      </div>
      <div style="background:var(--sf2);border-radius:7px;padding:8px 11px;font-size:12px;color:var(--tx2);margin-bottom:10px">
        <span style="font-weight:700;color:var(--tx3);font-size:10px;text-transform:uppercase">Defeito: </span>${o.defeito||'—'}
      </div>
      <div class="os-card-foot">
        <span style="font-size:11px;color:var(--tx3)">${o.data_atend?'Atendido em: '+fmtData(o.data_atend):''}</span>
        <button class="btn btn-ghost btn-sm" onclick="verDetalheOS('${o.id}')">📄 Ver Detalhes / PDF</button>
      </div>
    </div>`;
  }).join('');
}

function popularEquips() {
  const sel = document.getElementById('p-eq-sel');
  sel.innerHTML = '<option value="">Selecionar equipamento...</option>' +
    PG.equips.map(e=>`<option value="${e.id}" data-modelo="${e.modelo}" data-nserie="${e.nserie}">${e.nome}${e.modelo?' — '+e.modelo:''} ${e.nserie?'('+e.nserie+')':''}</option>`).join('');
}

function preencherEq() {
  const sel = document.getElementById('p-eq-sel');
  const opt = sel.options[sel.selectedIndex];
  if (!opt.value) return;
  document.getElementById('p-modelo').value = opt.dataset.modelo||'';
  document.getElementById('p-nserie').value = opt.dataset.nserie||'';
}

// ── ABRIR CHAMADO ──
async function abrirChamado() {
  const defeito = document.getElementById('p-defeito').value.trim();
  if (!defeito) { alert('Descreva o defeito / problema.'); return; }
  const body = {
    modelo: document.getElementById('p-modelo').value,
    nserie: document.getElementById('p-nserie').value,
    contador: document.getElementById('p-contador').value,
    tipo: document.getElementById('p-tipo').value,
    sla_prazo: document.getElementById('p-sla').value,
    defeito, obs: document.getElementById('p-obs').value,
    contato: document.getElementById('p-contato').value,
    tel: document.getElementById('p-tel').value,
  };
  try {
    const res = await api('POST','/api/portal/chamado', body);
    document.getElementById('p-ok-num').textContent = '#'+res.num;
    document.getElementById('p-ok-msg').style.display = 'block';
    // Limpa form
    ['p-modelo','p-nserie','p-contador','p-defeito','p-obs','p-contato','p-tel'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('p-eq-sel').value='';
    document.getElementById('p-tipo').value='Corretiva';
    document.getElementById('p-sla').value='24h';
    // Recarrega lista
    await carregarPortal();
    setTimeout(()=>pNav('chamados',document.querySelector('.pnav-btn')),2000);
  } catch(e) { alert(e.message); }
}

// ── UTILS ──
function fmtData(d) {
  if (!d) return '—';
  const p = d.slice(0,10).split('-');
  if (p.length < 3) return d;
  return `${p[2]}/${p[1]}/${p[0]}`;
}
function fmtDataHora(d) {
  if (!d) return '—';
  const dt = new Date(d);
  return dt.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
